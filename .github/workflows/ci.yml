name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: GraviDex Capabilities Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js (for secure-audit and rev-engineer)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Unified Test Runner
        run: |
          python3 -B test_all.py

      - name: Run GraviDex Capability Validation
        run: |
          python3 -B -m unittest discover -s TESTS/capability-tests
          python3 -B scripts/validate.py --capabilities

      - name: Verify Packaging Engine
        run: |
          python3 -B package.py
